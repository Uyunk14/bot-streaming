<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tes DRM</title>
<style>
  :root { --bg:#0E0F13; --card:#181A21; --line:#262934; --text:#ECEDF2; --muted:#9097A8; --ok:#22C55E; --bad:#EF4444; --warn:#F59E0B; --accent:#6A4DF4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:18px; margin:0; }
  .muted { color:var(--muted); font-size:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  video { width:100%; aspect-ratio:16/9; background:#000; border-radius:12px; display:block; }
  .verdict { font-weight:800; font-size:16px; padding:12px; border-radius:12px; text-align:center; background:var(--card); border:1px solid var(--line); }
  .verdict.ok { background:rgba(34,197,94,.15); border-color:var(--ok); color:var(--ok); }
  .verdict.bad { background:rgba(239,68,68,.12); border-color:var(--bad); color:var(--bad); }
  #log { font:12px/1.55 ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; word-break:break-word; margin:0; }
  .g { color:var(--ok); } .r { color:var(--bad); } .y { color:var(--warn); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { flex:1; min-height:40px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:700; font-size:14px; }
  button.ghost { background:var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <div><h1>🧪 Tes DRM Prime Video</h1><div class="muted" id="sub">Menyiapkan…</div></div>
  <video id="v" controls playsinline></video>
  <div class="verdict" id="verdict">Sedang mengetes…</div>
  <div class="row"><button id="again">Ulangi tes</button><button class="ghost" id="copy">Salin log</button></div>
  <button id="ext" hidden style="background:#22C55E;width:100%">🌐 Tes buka lewat browser (openLink)</button>
  <div class="card"><pre id="log"></pre></div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
(function () {
  var TG = window.Telegram && Telegram.WebApp;
  try { if (TG) { TG.ready(); TG.expand(); } } catch (e) {}
  var SHAKA = 'https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.12.6/shaka-player.compiled.js';
  var $log = document.getElementById('log'), $v = document.getElementById('v'), $verdict = document.getElementById('verdict');
  var t0 = Date.now(), done = false, player = null, info = null;

  function log(msg, cls) {
    var s = '[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + msg;
    var el = document.createElement('span'); if (cls) el.className = cls; el.textContent = s + '\n';
    $log.appendChild(el);
  }
  function verdict(ok, text) {
    if (done && !ok) return;
    done = ok || done;
    $verdict.className = 'verdict ' + (ok ? 'ok' : 'bad');
    $verdict.textContent = text;
  }
  var KIDS = [], WV = [], loggedPssh = false;
  // Kotak PSSH Widevine (v0): SystemID edef8ba9-79d6-4ace-a3c8-27dcd51d21ed,
  // isi = WidevineCencHeader { key_id (field 2) ... }
  function wvPssh(kids) {
    var data = [];
    kids.forEach(function (k) {
      data.push(0x12, 0x10);
      for (var i = 0; i < 32; i += 2) data.push(parseInt(k.substr(i, 2), 16));
    });
    return wvBox(data);
  }
  /** Bungkus isi WidevineCencHeader mentah menjadi kotak PSSH lengkap. */
  function wvBox(data) {
    data = Array.prototype.slice.call(data);
    var sys = 'edef8ba979d64acea3c827dcd51d21ed', size = 32 + data.length, out = [];
    var u32 = function (n) { out.push((n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255); };
    u32(size); out.push(0x70, 0x73, 0x73, 0x68); u32(0);
    for (var j = 0; j < 32; j += 2) out.push(parseInt(sys.substr(j, 2), 16));
    u32(data.length);
    return new Uint8Array(out.concat(data));
  }
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }

  function env() {
    log('Perangkat: ' + navigator.userAgent);
    log('Telegram: ' + (TG && TG.platform && TG.platform !== 'unknown' ? TG.platform + ' (versi ' + TG.version + ')' : 'tidak (browser biasa)'));
    log('MediaSource: ' + (window.MediaSource ? 'ada' : 'TIDAK ADA'), window.MediaSource ? 'g' : 'r');
    log('EME (requestMediaKeySystemAccess): ' + (navigator.requestMediaKeySystemAccess ? 'ada' : 'TIDAK ADA'), navigator.requestMediaKeySystemAccess ? 'g' : 'r');
  }

  function checkKS() {
    if (!navigator.requestMediaKeySystemAccess) return Promise.resolve({});
    var vc = function (rob) { return [{ initDataTypes: ['cenc'], videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.4D401E"', robustness: rob }], audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"', robustness: rob ? 'SW_SECURE_CRYPTO' : '' }] }]; };
    var tests = [
      ['Widevine L1 (HW_SECURE_ALL)', 'com.widevine.alpha', 'HW_SECURE_ALL'],
      ['Widevine L3 (SW_SECURE_CRYPTO)', 'com.widevine.alpha', 'SW_SECURE_CRYPTO'],
      ['PlayReady', 'com.microsoft.playready', ''],
      ['FairPlay (Apple)', 'com.apple.fps', '']
    ];
    var res = {};
    return tests.reduce(function (p, t) {
      return p.then(function () {
        return navigator.requestMediaKeySystemAccess(t[1], vc(t[2])).then(function () { res[t[0]] = true; log(t[0] + ': DIDUKUNG', 'g'); },
          function () { res[t[0]] = false; log(t[0] + ': tidak', t[1] === 'com.widevine.alpha' ? 'y' : ''); });
      });
    }, Promise.resolve()).then(function () { return res; });
  }

  function loadShaka() {
    return new Promise(function (ok, no) {
      if (window.shaka) return ok();
      var s = document.createElement('script'); s.src = SHAKA; s.onload = ok; s.onerror = function () { no(new Error('Gagal memuat Shaka Player')); };
      document.head.appendChild(s);
    });
  }

  function getInfo() {
    return fetch('../api/?a=pv_info&' + location.search.slice(1)).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) throw new Error(j.error || 'Gagal mengambil data');
      return j.data;
    });
  }

  function play(url, label) {
    log('— Memutar lewat ' + label + ' —');
    var p = player;
    return p.load(url, null, 'application/dash+xml').then(function () {
      var tr = p.getVariantTracks().filter(function (t) { return t.active; })[0];
      log('Manifest + lisensi OK. Track aktif: ' + (tr ? tr.width + 'x' + tr.height + ' @' + Math.round(tr.bandwidth / 1000) + 'kbps' : '?'), 'g');
      var hs = p.getVariantTracks().map(function (t) { return t.height; }).filter(function (h, i, a) { return a.indexOf(h) === i; }).sort(function (a, b) { return b - a; });
      log('Resolusi yang bisa diputar: ' + hs.join(', '));
      var pr = $v.play(); if (pr && pr.catch) pr.catch(function () { log('Autoplay ditahan browser — tekan ▶ pada video.', 'y'); });
      return true;
    });
  }

  function errText(e) {
    if (e && e.code) {
      var n = ''; try { for (var k in shaka.util.Error.Code) if (shaka.util.Error.Code[k] === e.code) n = k; } catch (x) {}
      return 'Shaka error ' + e.code + (n ? ' (' + n + ')' : '') + ' data=' + JSON.stringify(e.data || []).slice(0, 300);
    }
    return String(e && e.message || e);
  }

  function run() {
    done = false; $log.textContent = ''; t0 = Date.now(); KIDS = []; WV = []; loggedPssh = false;
    $verdict.className = 'verdict'; $verdict.textContent = 'Sedang mengetes…';
    env();
    checkKS().then(function (ks) {
      if (!ks['Widevine L1 (HW_SECURE_ALL)'] && !ks['Widevine L3 (SW_SECURE_CRYPTO)']) {
        verdict(false, '❌ Perangkat/aplikasi ini TIDAK mendukung Widevine');
      }
      log('Mengambil data video dari server…');
      return Promise.all([getInfo(), loadShaka()]);
    }).then(function (r) {
      info = r[0];
      document.getElementById('sub').textContent = info.title + ' · ' + info.episode + (info.audio ? ' · audio ' + info.audio : '');
      log('Judul: ' + info.title + ' (' + info.episode + '), DRM: ' + (info.drm ? 'ya' : 'tidak'));
      log('Subtitle tersedia: ' + (info.subtitles.map(function (s) { return s.lang + '/' + s.format; }).join(', ') || '-'));
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) throw new Error('Shaka: browser tidak didukung');
      log('Shaka Player ' + shaka.Player.version + ' siap.');
      // Beberapa cara dicoba berurutan sampai ada yang berhasil.
      // Manifest Prime membawa data Widevine "telanjang" (tanpa kotak PSSH) -> ditolak HP
      // ("Initialization data for CENC is incorrect"). Data itu dibungkus ulang di sini.
      var tries = [
        { name: 'PSSH manifest dibungkus, L3', pssh: 'mpd', rob: 'SW_SECURE_CRYPTO', url: info.stream },
        { name: 'PSSH dari KID, L3', pssh: 'kid', rob: 'SW_SECURE_CRYPTO', url: info.stream },
        { name: 'PSSH manifest dibungkus, keamanan bawaan', pssh: 'mpd', rob: '', url: info.stream },
        { name: 'PSSH manifest dibungkus, proxy Indocast', pssh: 'mpd', rob: '', url: info.stream_proxy }
      ].filter(function (t) { return t.url; });
      return fetch(info.stream).then(function (r) { return r.text(); }).then(function (mpd) {
        var m, re = /default_KID\s*=\s*"([0-9a-fA-F-]{32,36})"/g;
        while ((m = re.exec(mpd))) { var k = m[1].replace(/-/g, '').toLowerCase(); if (KIDS.indexOf(k) < 0) KIDS.push(k); }
        log('ID kunci (KID) di manifest: ' + (KIDS.join(', ') || 'TIDAK ADA'), KIDS.length ? 'g' : 'r');
        var rw = /EDEF8BA9-79D6-4ACE-A3C8-27DCD51D21ED"[^>]*>\s*<cenc:pssh>\s*([A-Za-z0-9+\/=]+)/gi, seen = {};
        while ((m = rw.exec(mpd))) {
          if (seen[m[1]]) continue; seen[m[1]] = 1;
          var u = b64(m[1]), hex = Array.prototype.map.call(u, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
          var isBox = u.length > 8 && u[4] === 0x70 && u[5] === 0x73 && u[6] === 0x73 && u[7] === 0x68;
          WV.push({ data: u, box: isBox, kid: KIDS.filter(function (k) { return hex.indexOf(k) >= 0; })[0] || '' });
        }
        log('Data Widevine di manifest: ' + WV.length + ' (' + (WV[0] ? (WV[0].box ? 'sudah kotak PSSH' : 'mentah, perlu dibungkus') : '-') + ')', WV.length ? 'g' : 'y');
      }, function () { log('Manifest tidak bisa dibaca langsung (KID diambil dari Shaka).', 'y'); }).then(function () { return attempt(0); });
      function attempt(i) {
        loggedPssh = false;
        var t = tries[i];
        return (player ? player.destroy() : Promise.resolve()).then(function () {
          player = new shaka.Player();
          return player.attach($v);
        }).then(function () {
          var adv = {};
          if (t.rob) { adv.videoRobustness = t.rob; adv.audioRobustness = t.rob; }
          var drm = { servers: { 'com.widevine.alpha': info.license }, advanced: { 'com.widevine.alpha': adv } };
          drm.initDataTransform = function (initData, type, drmInfo) {
            var ks = [];
            try { if (drmInfo && drmInfo.keyIds) drmInfo.keyIds.forEach(function (k) { ks.push(String(k).toLowerCase()); }); } catch (x) {}
            if (t.pssh === 'mpd' && WV.length) {
              var e = WV.filter(function (w) { return w.kid && ks.indexOf(w.kid) >= 0; })[0] || WV[0];
              if (!loggedPssh) { loggedPssh = true; log('Memakai data Widevine manifest' + (e.box ? '' : ' (dibungkus kotak PSSH)') + ', KID ' + (e.kid || '?') + '.'); }
              return e.box ? e.data : wvBox(e.data);
            }
            KIDS.forEach(function (k) { if (ks.indexOf(k) < 0) ks.push(k); });
            if (!ks.length) return initData;
            if (!loggedPssh) { loggedPssh = true; log('Memakai PSSH buatan dari ' + ks.length + ' KID.'); }
            return wvPssh(ks);
          };
          player.configure({ drm: drm, streaming: { bufferingGoal: 20 } });
          var ne = player.getNetworkingEngine();
          ne.registerRequestFilter(function (type, req) {
            if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) log('Minta lisensi (' + (req.body ? req.body.byteLength : 0) + ' byte)…');
          });
          ne.registerResponseFilter(function (type, resp) {
            if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) log('Lisensi diterima (' + resp.data.byteLength + ' byte).', 'g');
          });
          player.addEventListener('error', function (ev) { log(errText(ev.detail), 'r'); });
          player.addEventListener('keystatuschanged', function () {
            try { var m = player.getKeyStatuses(); log('Status kunci: ' + JSON.stringify(m), JSON.stringify(m).indexOf('usable') >= 0 ? 'g' : 'y'); } catch (x) {}
          });
          return play(t.url, 'cara ' + (i + 1) + ': ' + t.name);
        }).catch(function (e) {
          log('Gagal: ' + errText(e), 'r');
          if (e && e.code === 6001) throw e; // memang tidak ada Widevine
          if (i + 1 < tries.length) return attempt(i + 1);
          throw e;
        });
      }
    }).catch(function (e) {
      log('GAGAL: ' + errText(e), 'r');
      verdict(false, '❌ Video tidak bisa diputar — kirim screenshot log ini');
    });
  }

  var shown = false;
  $v.addEventListener('timeupdate', function () {
    if (!shown && $v.currentTime > 3) {
      shown = true;
      var h = $v.videoHeight;
      log('Video BERJALAN (' + $v.videoWidth + 'x' + h + ').', 'g');
      verdict(true, '✅ BERHASIL — video DRM bisa diputar (' + h + 'p)');
    }
  });
  $v.addEventListener('waiting', function () { if (!shown) log('Memuat video…'); });
  // Di Telegram: buka halaman yang sama lewat openLink (tab Chrome bawaan Telegram mendukung DRM)
  (function () {
    var b = document.getElementById('ext');
    if (!(TG && TG.platform && TG.platform !== 'unknown')) return;
    b.hidden = false;
    b.onclick = function () { try { TG.openLink(location.href, { try_instant_view: false }); } catch (e) { location.href = location.href; } };
  })();


  document.getElementById('again').onclick = function () {
    shown = false;
    (player ? player.destroy() : Promise.resolve()).then(function () { player = null; run(); });
  };
  document.getElementById('copy').onclick = function () {
    var t = $log.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { alert('Log disalin.'); }, function () { alert('Tidak bisa menyalin, kirim screenshot saja.'); });
  };
  run();
})();
</script>
</body>
</html>
